<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 🔐 SECURITY CHECK -->
<script>
if (localStorage.getItem("adminLoggedIn") !== "yes") {
  window.location.href = "admin-login.html";
}
</script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f8;
}
.header{
  background:#2c5364;
  color:white;
  padding:15px;
  text-align:center;
}
.card{
  background:white;
  margin:20px;
  padding:20px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
}
button{
  background:#2c5364;
  color:white;
  border:none;
  padding:10px 15px;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <h2>Admin Dashboard</h2>
</div>

<div class="card">
  <p>Welcome Admin 👋</p>
  <button onclick="logout()">Logout</button>
</div>

<script>
function logout(){
  localStorage.removeItem("adminLoggedIn");
  window.location.href="admin-login.html";
}
</script>

</body>
</html>
