<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Secure Login | Smart Dukaan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0b3c5d, #0a2540);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrapper {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 36px 30px;
      text-align: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #0b3c5d;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #1e90ff;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #1e90ff;
      color: #fff;
      font-size: 16px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
    }

    .security-note {
      margin-top: 16px;
      font-size: 12px;
      color: #c0392b;
    }

    .version {
      margin-top: 18px;
      font-size: 11px;
      color: #888;
    }

    .back-area {
      margin-top: 24px;
      text-align: center;
    }

    .back-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      opacity: 0.9;
    }

    .back-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <div class="card">
      <div class="logo">Smart Dukaan</div>
      <div class="subtitle">Admin Secure Access Panel</div>

      <input type="tel" id="mobile" placeholder="Admin Mobile Number" inputmode="numeric">
      <input type="password" id="password" placeholder="Password">

      <button class="login-btn" onclick="adminLogin()">Login</button>

      <div class="security-note">
        Authorized admins only. All activity is monitored.
      </div>

      <div class="version">
        Premium Plus Professional • Build 1.0
      </div>
    </div>

    <div class="back-area">
      <button class="back-btn" onclick="goHome()">← Back to Home</button>
    </div>
  </div>

  <script>
    function goHome() {
      window.location.href = "index.html";
    }

    function adminLogin() {
      const mobile = document.getElementById("mobile").value.trim();
      const password = document.getElementById("password").value.trim();

      // TEMP DEMO CREDENTIALS
      if (mobile === "9999999999" && password === "admin123") {
        sessionStorage.setItem("adminLoggedIn", "true");
        window.location.href = "admin-dashboard.html";
      } else {
        alert("Invalid admin credentials");
      }
    }
  </script>

</body>
</html>
