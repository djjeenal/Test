<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gujarati Music Box Premium</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
overflow-x:hidden;
}

.glass{
background:rgba(255,255,255,.06);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
box-shadow:0 8px 32px rgba(0,0,0,.35);
}

.song-card{
transition:.35s;
border-radius:24px;
overflow:hidden;
}

.song-card:hover{
transform:translateY(-8px);
}

.hero-bg{
background:
linear-gradient(
135deg,
rgba(6,182,212,.15),
rgba(59,130,246,.08)
);
}

.hide{
display:none;
}

::-webkit-scrollbar{
width:6px;
}

::-webkit-scrollbar-thumb{
background:#06b6d4;
border-radius:20px;
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="sticky top-0 z-50 backdrop-blur bg-[#020617cc] border-b border-cyan-900/30">
<div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

<h1 class="text-2xl md:text-3xl font-bold text-cyan-400">
🎵 Gujarati Music Box
</h1>

<div class="flex items-center gap-3">

<button
onclick="adminLogin()"
class="bg-cyan-500 hover:bg-cyan-600 px-4 py-2 rounded-xl font-semibold">
Admin
</button>

</div>
</div>
</header>

<!-- HERO SECTION -->
<section class="hero-bg py-10 px-4">
<div class="max-w-7xl mx-auto">

<div class="glass rounded-[35px] p-8">

<div class="grid md:grid-cols-2 gap-8 items-center">

<div>

<span class="bg-cyan-500/20 text-cyan-300 px-4 py-2 rounded-full text-sm">
🔥 Premium Music Platform
</span>

<h2 class="text-4xl md:text-6xl font-bold mt-5 leading-tight">
Listen Unlimited
<span class="text-cyan-400">
Gujarati Music
</span>
</h2>

<p class="text-slate-300 mt-5 text-lg">
Stream, Play, Download & Enjoy premium Gujarati and Hindi songs with app-like experience.
</p>

<div class="flex gap-3 mt-6">

<button class="bg-cyan-500 px-6 py-3 rounded-2xl font-semibold">
▶ Explore Music
</button>

<button class="glass px-6 py-3 rounded-2xl">
🎧 Trending
</button>

</div>

</div>

<div>
<img
src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?q=80&w=1200&auto=format&fit=crop"
class="rounded-[35px] w-full h-[320px] object-cover">
</div>

</div>
</div>

</div>
</section>

<!-- SEARCH -->
<section class="max-w-7xl mx-auto px-4 mt-6">

<input
id="search"
placeholder="Search songs, singer..."
class="w-full p-4 rounded-2xl bg-slate-900 border border-cyan-800 outline-none text-white">

</section>

<!-- CATEGORY -->
<section class="max-w-7xl mx-auto px-4 mt-5">

<div class="flex gap-3 overflow-auto pb-2">

<button onclick="filterSongs('all')" class="glass px-5 py-3 rounded-2xl whitespace-nowrap">All</button>

<button onclick="filterSongs('Gujarati Songs')" class="glass px-5 py-3 rounded-2xl whitespace-nowrap">Gujarati</button>

<button onclick="filterSongs('Hindi Songs')" class="glass px-5 py-3 rounded-2xl whitespace-nowrap">Hindi</button>

<button onclick="filterSongs('Devotional')" class="glass px-5 py-3 rounded-2xl whitespace-nowrap">Devotional</button>

<button onclick="filterSongs('DJ Remix')" class="glass px-5 py-3 rounded-2xl whitespace-nowrap">DJ Remix</button>

</div>

</section>

<!-- ADMIN PANEL -->
<section class="max-w-7xl mx-auto px-4 mt-6">

<div id="adminPanel" class="hide glass rounded-[35px] p-6">

<h2 class="text-2xl font-bold mb-5">
⬆ Upload Song
</h2>

<div class="grid md:grid-cols-2 gap-4">

<input id="title" placeholder="Song Title" class="bg-slate-900 p-4 rounded-2xl">

<input id="singer" placeholder="Singer Name" class="bg-slate-900 p-4 rounded-2xl">

<select id="category" class="bg-slate-900 p-4 rounded-2xl">
<option>Gujarati Songs</option>
<option>Hindi Songs</option>
<option>Devotional</option>
<option>DJ Remix</option>
</select>

<input id="thumbnail" type="file" accept="image/*" class="bg-slate-900 p-4 rounded-2xl">

<input id="song" type="file" accept="audio/*" class="bg-slate-900 p-4 rounded-2xl">

</div>

<button
onclick="uploadSong()"
class="mt-5 bg-cyan-500 px-6 py-3 rounded-2xl font-bold">
Upload Song
</button>

</div>

</section>

<!-- SONGS -->
<section class="max-w-7xl mx-auto px-4 mt-8 pb-40">

<h2 class="text-2xl font-bold mb-5">
🎵 Latest Songs
</h2>

<div id="songs" class="grid md:grid-cols-3 gap-5"></div>

</section>

<!-- PLAYER -->
<div class="fixed bottom-0 left-0 w-full glass border-t border-cyan-900/30 p-4 z-50">

<div class="max-w-7xl mx-auto flex items-center gap-4">

<div class="w-14 h-14 rounded-2xl bg-slate-900 flex items-center justify-center text-2xl">
🎵
</div>

<div class="flex-1">
<p class="font-semibold" id="nowPlaying">
No song playing
</p>

<audio id="player" controls class="w-full mt-1"></audio>
</div>

</div>
</div>

<script type="module">
  import {
initializeApp
} from
'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
query,
orderBy
} from
'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';


const firebaseConfig = {

apiKey:
'AIzaSyDA9uockP50yK8WtE-b9SNtDGth7AeEgjI',

authDomain:
'kakateastall-64dc3.firebaseapp.com',

projectId:
'kakateastall-64dc3',

storageBucket:
'kakateastall-64dc3.firebasestorage.app',

messagingSenderId:
'724861765174',

appId:
'1:724861765174:web:75805dadd5898ea4cd7a97'
};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


const CLOUD_NAME =
'djxxne8j0';

const PRESET =
'gujarati_music_box';


const ADMIN_PASSWORD =
'GujaratiMusic#Box2026';


let isAdmin = false;
let currentFilter = 'all';



window.adminLogin = () => {

const pass =
prompt(
'Enter Admin Password'
);

if(pass === ADMIN_PASSWORD){

isAdmin = true;

document
.getElementById(
'adminPanel'
)
.classList
.remove(
'hide'
);

loadSongs();

alert(
'Admin Login Success'
);

}else{

alert(
'Wrong Password'
);

}
};



async function uploadCloud(
file,
type='auto'
){

const fd =
new FormData();

fd.append(
'file',
file
);

fd.append(
'upload_preset',
PRESET
);

const response =
await fetch(
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${type}/upload`,
{
method:'POST',
body:fd
}
);

return await response.json();

}



window.uploadSong =
async () => {

const title =
document
.getElementById(
'title'
).value;

const singer =
document
.getElementById(
'singer'
).value;

const category =
document
.getElementById(
'category'
).value;

const thumbnail =
document
.getElementById(
'thumbnail'
)
.files[0];

const song =
document
.getElementById(
'song'
)
.files[0];


if(
!title ||
!singer ||
!thumbnail ||
!song
){

return alert(
'Please fill all fields'
);

}


alert(
'Uploading Song...'
);


const imageUpload =
await uploadCloud(
thumbnail,
'image'
);

const audioUpload =
await uploadCloud(
song,
'video'
);


await addDoc(
collection(
db,
'songs'
),
{
title,
singer,
category,

thumbnail:
imageUpload.secure_url,

audio:
audioUpload.secure_url,

createdAt:
Date.now()
}
);


alert(
'Song Uploaded Successfully'
);

loadSongs();

};
  window.deleteSong =
async(id)=>{

const ok =
confirm(
'Delete this song?'
);

if(!ok) return;

await deleteDoc(
doc(
db,
'songs',
id
)
);

loadSongs();
};



window.filterSongs =
(category)=>{

currentFilter =
category;

loadSongs();

};



async function loadSongs(){

const box =
document.getElementById(
'songs'
);

box.innerHTML =
'Loading Songs...';


const snap =
await getDocs(
query(
collection(
db,
'songs'
),
orderBy(
'createdAt',
'desc'
)
)
);


const search =
document
.getElementById(
'search'
)
.value
.toLowerCase();


box.innerHTML =
'';


snap.forEach((d)=>{

const s =
d.data();


if(
currentFilter !== 'all'
&&
s.category !== currentFilter
){
return;
}


if(
search &&
!(
`${s.title}
${s.singer}`
.toLowerCase()
.includes(search)
)
){
return;
}



box.innerHTML += `

<div class="song-card glass p-4">

<img
src="${s.thumbnail}"
class="w-full h-[240px] object-cover rounded-[24px]"
>

<div class="mt-4">

<h3 class="font-bold text-xl">
${s.title}
</h3>

<p class="text-slate-300">
${s.singer}
</p>

<p class="text-cyan-400 text-sm mt-1">
${s.category}
</p>

<div class="flex gap-2 mt-4 flex-wrap">

<button
onclick="
document.getElementById('player').src='${s.audio}';
document.getElementById('player').play();
document.getElementById('nowPlaying').innerText='${s.title}';
"
class="bg-cyan-500 hover:bg-cyan-600 px-4 py-2 rounded-xl font-semibold"
>
▶ Play
</button>

<a
href="${s.audio}"
download
class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-xl font-semibold"
>
⬇ Download
</a>

${isAdmin ? `

<button
onclick="deleteSong('${d.id}')"
class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-xl font-semibold"
>
🗑 Delete
</button>

` : ''}

</div>

</div>

</div>

`;

});

}



document
.getElementById(
'search'
)
.addEventListener(
'input',
loadSongs
);


loadSongs();

</script>

</body>
</html>
