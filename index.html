<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Dukaan™ | Premium Business System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SECURITY: prevent caching -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #0b3c55, #031d2c);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card {
      width: 90%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      border-radius: 22px;
      padding: 32px 26px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .title {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .title span {
      color: #20d3ff;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.9;
    }

    .divider {
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, #20d3ff, #0aa3ff);
      margin: 18px auto;
      border-radius: 10px;
    }

    ul {
      list-style: none;
      margin: 18px 0 26px;
    }

    ul li {
      margin: 10px 0;
      font-size: 15px;
      opacity: 0.95;
    }

    .btn {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #21d4fd, #0b8cff);
      color: #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }

    .note {
      margin-top: 14px;
      font-size: 12px;
      opacity: 0.7;
    }

    .footer {
      margin-top: 18px;
      font-size: 11px;
      opacity: 0.55;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="title">Smart <span>Dukaan™</span></div>
    <div class="subtitle">Premium Shop Management Platform</div>

    <div class="divider"></div>

    <ul>
      <li>• Multi-Shop Ready</li>
      <li>• Secure Role-Based Access</li>
      <li>• Wallet • UPI • Udhar System</li>
    </ul>

    <button class="btn" onclick="goToLogin()">
      Continue as Admin
    </button>

    <div class="note">
      Customers must scan shop QR to access ordering system
    </div>

    <div class="footer">
      © 2026 Smart Dukaan • Premium Plus Professional
    </div>
  </div>

  <script>
    // STEP-1 SECURITY GATE
    function goToLogin() {
      window.location.href = "login.html";
    }

    // BLOCK BACK BUTTON CACHE
    window.onpageshow = function(event) {
      if (event.persisted) {
        window.location.reload();
      }
    };
  </script>

</body>
</html>
